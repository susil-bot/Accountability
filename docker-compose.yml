services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accountability
      POSTGRES_PASSWORD: accountability
      POSTGRES_DB: accountability
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountability"]
      interval: 3s
      timeout: 3s
      retries: 20


volumes:
  pgdata:
