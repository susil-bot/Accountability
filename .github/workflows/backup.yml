# Nightly encrypted database backup for the free cloud setup (Supabase's free plan has no downloadable backups).
# Repository secrets: DATABASE_URL (same as Render) and BACKUP_PASSPHRASE (long random string, keep it safe).
# Restore: download the artifact, then
#   openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:'<passphrase>' -in db.dump.enc -out db.dump
#   pg_restore --clean --if-exists --no-owner --dbname "<url without ?params>" db.dump
name: nightly-backup
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -eu
          [ -n "$DATABASE_URL" ] && [ -n "$BACKUP_PASSPHRASE" ] || { echo "Set the DATABASE_URL and BACKUP_PASSPHRASE secrets"; exit 1; }
          apt-get update -qq && apt-get install -y -qq openssl >/dev/null
          SCHEMA=$(echo "$DATABASE_URL" | sed -nE 's/.*[?&]schema=([^&]+).*/\1/p'); SCHEMA=${SCHEMA:-public}
          URL="${DATABASE_URL%%\?*}?sslmode=require"
          pg_dump --format=custom --no-owner --schema="$SCHEMA" --dbname="$URL" --file=db.dump
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in db.dump -out db.dump.enc
          rm db.dump
          ls -la db.dump.enc
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: db.dump.enc
          retention-days: 14
