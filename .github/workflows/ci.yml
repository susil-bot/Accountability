name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://accountability:accountability@localhost:5432/accountability?schema=public
  TEST_DATABASE_URL: postgresql://accountability:accountability@localhost:5432/accountability_test?schema=public
  JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0000
  STORAGE_SIGNING_SECRET: ci-only-signing-secret
  APP_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:4000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accountability
          POSTGRES_PASSWORD: accountability
          POSTGRES_DB: accountability
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accountability" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accountability
          POSTGRES_PASSWORD: accountability
          POSTGRES_DB: accountability
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accountability" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run db:migrate
      - name: Demo data for E2E (admin, mentors with profiles, clients)
        run: npm run db:seed
      - name: The admin CLI works (the only way to make an admin)
        run: npm run create-admin -- --email ci-admin@accountability.dev --name "CI Admin"
        env:
          ADMIN_PASSWORD: Password123
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API and web
        run: |
          (cd apps/api && npx dotenv -e ../../.env -- node dist/main.js &)
          (cd apps/web && API_INTERNAL_URL=http://localhost:4000 npm start &)
          npx wait-on -t 60000 http://localhost:4000/health http://localhost:3000
      - run: npm run test:e2e

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image (same Dockerfile the server uses)
        run: docker build -f deploy/api.Dockerfile -t accountability-api:ci .
